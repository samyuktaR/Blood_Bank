<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<form th:fragment="form(action, radius)" class="radius-form" method="get" th:action="@{${action}}">
    <label for="radiusKm">Search radius</label>
    <input type="number" id="radiusKm" name="radiusKm" min="1" max="500" step="1"
           th:value="${#numbers.formatDecimal(radius, 1, 0)}"> km
    <button type="submit" class="btn btn-sm">Update</button>
    <a th:each="preset : ${radiusPresets}" class="chip-btn"
       th:href="@{${action}(radiusKm=${preset})}"
       th:classappend="${radius == preset} ? 'active'"
       th:text="${preset}">25</a>
</form>
</body>
</html>
